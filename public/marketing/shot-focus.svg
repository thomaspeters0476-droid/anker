<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" role="img" aria-label="Tagesanker Fokus-Ansicht">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0ec"/>
      <stop offset="55%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#d4e4dc"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2b24" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="390" height="780" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="140" fill="#c5ddd2" opacity="0.4"/>
  <circle cx="40" cy="520" r="110" fill="#f0e2c8" opacity="0.35"/>

  <g font-family="Georgia, serif">
    <circle cx="36" cy="48" r="6" fill="#2f6f5e"/>
    <text x="52" y="55" font-size="26" font-weight="700" fill="#1f4d41">Tagesanker</text>
  </g>
  <text x="28" y="86" font-family="system-ui, sans-serif" font-size="13" fill="#4a5c52">Jetzt: eine Sache</text>

  <g filter="url(#s)">
    <rect x="22" y="118" width="346" height="72" rx="18" fill="rgba(255,252,247,0.9)" stroke="rgba(28,43,36,0.12)"/>
    <text x="40" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1f4d41">BUDDY</text>
    <text x="40" y="172" font-family="system-ui, sans-serif" font-size="16" fill="#1c2b24">Nur das. Der Rest wartet.</text>
  </g>

  <g filter="url(#s)">
    <rect x="22" y="220" width="346" height="220" rx="22" fill="rgba(255,252,247,0.95)" stroke="rgba(28,43,36,0.1)"/>
    <text x="40" y="260" font-family="system-ui, sans-serif" font-size="13" fill="#2c5f7a" font-weight="600">ARBEIT · M</text>
    <text x="40" y="310" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1c2b24">Angebot</text>
    <text x="40" y="344" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1c2b24">fertigstellen</text>
    <text x="40" y="390" font-family="system-ui, sans-serif" font-size="15" fill="#4a5c52">ca. 40 Min · ohne Ablenkung</text>
  </g>

  <rect x="22" y="470" width="346" height="52" rx="26" fill="#2f6f5e"/>
  <text x="128" y="503" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f7fbf9">Erledigt</text>

  <rect x="22" y="536" width="166" height="48" rx="24" fill="rgba(255,252,247,0.8)" stroke="rgba(28,43,36,0.12)"/>
  <text x="62" y="566" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c2b24">Überspringen</text>
  <rect x="202" y="536" width="166" height="48" rx="24" fill="rgba(255,252,247,0.8)" stroke="rgba(28,43,36,0.12)"/>
  <text x="248" y="566" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c2b24">Geistesblitz</text>

  <rect x="22" y="610" width="346" height="48" rx="24" fill="rgba(47,111,94,0.12)" stroke="rgba(47,111,94,0.25)"/>
  <text x="155" y="640" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f4d41">Ruhe</text>

  <text x="28" y="700" font-family="system-ui, sans-serif" font-size="14" fill="#4a5c52">Noch 1 Arbeit · 2 Alltag</text>
</svg>
