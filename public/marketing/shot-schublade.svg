<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" role="img" aria-label="Die Schublade: Ablegen und Schritte holen">
  <defs>
    <linearGradient id="drawerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0ec"/>
      <stop offset="55%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#d4e4dc"/>
    </linearGradient>
  </defs>
  <rect width="390" height="780" fill="url(#drawerBg)"/>
  <circle cx="330" cy="140" r="120" fill="#c5ddd2" opacity="0.45"/>
  <circle cx="40" cy="620" r="130" fill="#2f6f5e" opacity="0.08"/>

  <!-- Notch-Abstand: Inhalt erst unter dem Fake-Notch -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <circle cx="36" cy="72" r="6" fill="#2f6f5e"/>
    <circle cx="36" cy="72" r="12" fill="#2f6f5e" opacity="0.18"/>
    <text x="52" y="79" font-size="24" font-weight="700" fill="#1f4d41">Die Schublade</text>
  </g>
  <text x="28" y="108" font-family="system-ui, sans-serif" font-size="13" fill="#4a5c52">Ablegen &amp; vorbereiten</text>

  <rect x="22" y="128" width="346" height="84" rx="18" fill="#fffdf9" stroke="rgba(28,43,36,0.12)"/>
  <text x="40" y="156" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1f4d41">BUDDY</text>
  <text x="40" y="182" font-family="system-ui, sans-serif" font-size="15" fill="#1c2b24">Alles sicher hier.</text>
  <text x="40" y="204" font-family="system-ui, sans-serif" font-size="14" fill="#4a5c52">Nichts muss sofort.</text>

  <text x="28" y="250" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1c2b24">Eingang</text>
  <rect x="22" y="264" width="346" height="70" rx="16" fill="#fffdf9" stroke="rgba(28,43,36,0.1)"/>
  <text x="40" y="294" font-family="system-ui, sans-serif" font-size="16" fill="#1c2b24">Nebenkosten vorbereiten</text>
  <text x="40" y="318" font-family="system-ui, sans-serif" font-size="13" fill="#5c6b63">Zu zerlegen</text>

  <text x="28" y="372" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1c2b24">Zum Holen</text>

  <rect x="22" y="386" width="346" height="118" rx="16" fill="#fffdf9" stroke="rgba(47,111,94,0.28)"/>
  <text x="40" y="418" font-family="system-ui, sans-serif" font-size="16" fill="#1c2b24">Ordner mit Belegen holen</text>
  <text x="40" y="442" font-family="system-ui, sans-serif" font-size="13" fill="#2f6f5e">Schritt · Mini</text>
  <rect x="40" y="458" width="120" height="34" rx="10" fill="#2f6f5e"/>
  <text x="68" y="481" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7fbf9">Erledigt</text>
  <rect x="172" y="458" width="100" height="34" rx="10" fill="#fff" stroke="rgba(28,43,36,0.14)"/>
  <text x="198" y="481" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c2b24">Holen</text>

  <rect x="22" y="518" width="346" height="70" rx="16" fill="#fffdf9" stroke="rgba(28,43,36,0.08)"/>
  <text x="40" y="548" font-family="system-ui, sans-serif" font-size="16" fill="#1c2b24">Zahlen eintippen</text>
  <text x="40" y="572" font-family="system-ui, sans-serif" font-size="13" fill="#5c6b63">Schritt · Normal · spaeter</text>

  <rect x="22" y="612" width="346" height="52" rx="14" fill="rgba(47,111,94,0.12)"/>
  <text x="40" y="644" font-family="system-ui, sans-serif" font-size="14" fill="#1f4d41">3 von 25 zum Holen — klar bleiben.</text>

  <text x="28" y="710" font-family="system-ui, sans-serif" font-size="14" fill="#4a5c52">Sicher weg, nicht weg.</text>
</svg>
