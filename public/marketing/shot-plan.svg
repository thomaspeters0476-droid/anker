<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" role="img" aria-label="Tagesanker Plan-Ansicht">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0ec"/>
      <stop offset="55%" stop-color="#f7f3eb"/>
      <stop offset="100%" stop-color="#d4e4dc"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2b24" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="390" height="780" fill="url(#bg)"/>
  <circle cx="48" cy="120" r="120" fill="#c5ddd2" opacity="0.45"/>
  <circle cx="340" cy="80" r="90" fill="#f0e2c8" opacity="0.4"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <circle cx="36" cy="48" r="6" fill="#2f6f5e"/>
    <circle cx="36" cy="48" r="12" fill="#2f6f5e" opacity="0.18"/>
    <text x="52" y="55" font-size="28" font-weight="700" fill="#1f4d41">Tagesanker</text>
  </g>
  <text x="28" y="88" font-family="system-ui, sans-serif" font-size="14" fill="#4a5c52">Eine Sache. Realistisch. Zurückfinden.</text>

  <g filter="url(#s)">
    <rect x="22" y="112" width="346" height="88" rx="18" fill="rgba(255,252,247,0.9)" stroke="rgba(28,43,36,0.12)"/>
    <text x="40" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1f4d41">BUDDY</text>
    <text x="40" y="162" font-family="system-ui, sans-serif" font-size="16" fill="#1c2b24">Guten Morgen. Wie viel trägt heute?</text>
    <text x="40" y="184" font-family="system-ui, sans-serif" font-size="14" fill="#4a5c52">Wähl Kapazität  der Rest darf warten.</text>
  </g>

  <text x="28" y="236" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1c2b24">Kapazität</text>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="22" y="250" width="100" height="44" rx="22" fill="rgba(255,252,247,0.75)" stroke="rgba(28,43,36,0.12)"/>
    <text x="54" y="277" fill="#4a5c52">S</text>
    <rect x="134" y="250" width="100" height="44" rx="22" fill="#2f6f5e"/>
    <text x="166" y="277" fill="#f7fbf9">M</text>
    <rect x="246" y="250" width="100" height="44" rx="22" fill="rgba(255,252,247,0.75)" stroke="rgba(28,43,36,0.12)"/>
    <text x="280" y="277" fill="#4a5c52">L</text>
  </g>

  <text x="28" y="334" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1c2b24">Arbeit</text>
  <g filter="url(#s)" font-family="system-ui, sans-serif">
    <rect x="22" y="348" width="346" height="58" rx="16" fill="rgba(255,252,247,0.92)" stroke="rgba(28,43,36,0.1)"/>
    <text x="40" y="383" font-size="16" fill="#1c2b24">Angebot fertigstellen</text>
    <text x="300" y="383" font-size="13" fill="#2c5f7a">M · 40</text>
    <rect x="22" y="416" width="346" height="58" rx="16" fill="rgba(255,252,247,0.92)" stroke="rgba(28,43,36,0.1)"/>
    <text x="40" y="451" font-size="16" fill="#1c2b24">Mail an Team</text>
    <text x="308" y="451" font-size="13" fill="#2c5f7a">S · 15</text>
  </g>

  <text x="28" y="518" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1c2b24">Alltag</text>
  <g font-family="system-ui, sans-serif">
    <rect x="22" y="532" width="110" height="40" rx="20" fill="rgba(107,90,62,0.12)" stroke="rgba(107,90,62,0.25)"/>
    <text x="48" y="557" font-size="14" fill="#6b5a3e">Wasser</text>
    <rect x="142" y="532" width="110" height="40" rx="20" fill="rgba(107,90,62,0.12)" stroke="rgba(107,90,62,0.25)"/>
    <text x="168" y="557" font-size="14" fill="#6b5a3e">Bewegung</text>
    <rect x="262" y="532" width="106" height="40" rx="20" fill="rgba(107,90,62,0.12)" stroke="rgba(107,90,62,0.25)"/>
    <text x="290" y="557" font-size="14" fill="#6b5a3e">Pause</text>
  </g>

  <rect x="22" y="600" width="346" height="52" rx="26" fill="#2f6f5e"/>
  <text x="130" y="633" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f7fbf9">Tag starten</text>
</svg>
