<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6f5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tagesanker" />
    <meta
      name="description"
      content="Tagesanker hilft dir, den Tag mit einer Sache nach der anderen zu halten — ohne Scores, ohne Streaks, ohne Druck."
    />
    <script>
      /* Zwei PWAs: Manifest vor React setzen, damit „App installieren“ die richtige ist */
      (function () {
        if (location.pathname.indexOf('/schublade') !== 0) return
        var m = document.getElementById('app-manifest')
        if (m) m.setAttribute('href', '/manifest-schublade.webmanifest')
        var t = document.querySelector('meta[name="apple-mobile-web-app-title"]')
        if (t) t.setAttribute('content', 'Die Schublade')
        var d = document.querySelector('meta[name="description"]')
        if (d)
          d.setAttribute(
            'content',
            'Vorrat & Häppchen — sicher weg, nicht weg.',
          )
        document.title = 'Die Schublade — Vorrat & Häppchen'
      })()
    </script>
    <link rel="canonical" href="https://tagesanker.de/" />
    <meta property="og:title" content="Tagesanker" />
    <meta
      property="og:description"
      content="Eine Sache. Realistisch. Zurückfinden. — Fokus-App ohne Scores."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tagesanker.de/" />
    <meta property="og:locale" content="de_DE" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tagesanker",
        "url": "https://tagesanker.de/",
        "description": "Eine Sache. Realistisch. Zurückfinden.",
        "publisher": {
          "@type": "Organization",
          "name": "Tagesanker",
          "email": "info@tagesanker.de",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Im Krähwinkel 10",
            "addressLocality": "Linnich",
            "postalCode": "52441",
            "addressCountry": "DE"
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>Tagesanker — Eine Sache. Realistisch. Zurückfinden.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
