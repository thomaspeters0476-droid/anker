<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6f5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tagesanker" />
    <meta
      name="description"
      content="Tagesanker hilft dir, den Tag mit einer Sache nach der anderen zu halten — ohne Scores, ohne Streaks, ohne Druck."
    />
    <script>
      /* Zwei PWAs: Manifest vor React setzen, damit „App installieren“ die richtige ist */
      (function () {
        if (location.pathname.indexOf('/schublade') !== 0) return
        var m = document.getElementById('app-manifest')
        if (m) m.setAttribute('href', '/manifest-schublade.webmanifest')
        var t = document.querySelector('meta[name="apple-mobile-web-app-title"]')
        if (t) t.setAttribute('content', 'Die Schublade')
        var d = document.querySelector('meta[name="description"]')
        if (d)
          d.setAttribute(
            'content',
            'Vorrat & Häppchen — sicher weg, nicht weg.',
          )
        document.title = 'Die Schublade — Vorrat & Häppchen'
      })()
    </script>
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tagesanker.de/" />
    <meta property="og:title" content="Tagesanker" />
    <meta
      property="og:description"
      content="Eine Sache. Realistisch. Zurückfinden. — Fokus-App ohne Scores."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tagesanker.de/" />
    <meta property="og:locale" content="de_DE" />
    <script>
      /* Canonical je Pfad, sonst indexiert Google alle Routen als Startseite. */
      (function () {
        var origin = 'https://tagesanker.de'
        var path = location.pathname.replace(/\/+$/, '') || '/'
        var isApp =
          path === '/app' ||
          path.indexOf('/app/') === 0 ||
          path === '/schublade' ||
          path.indexOf('/schublade/') === 0
        var url = origin + (path === '/' ? '/' : path)
        var c = document.querySelector('link[rel="canonical"]')
        if (c) c.setAttribute('href', url)
        var og = document.querySelector('meta[property="og:url"]')
        if (og) og.setAttribute('content', url)
        var robots = document.querySelector('meta[name="robots"]')
        if (isApp && robots) {
          robots.setAttribute('content', 'noindex, nofollow')
        }
      })()
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tagesanker",
        "url": "https://tagesanker.de/",
        "description": "Eine Sache. Realistisch. Zurückfinden.",
        "publisher": {
          "@type": "Organization",
          "name": "Tagesanker",
          "email": "info@tagesanker.de",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Im Krähwinkel 10",
            "addressLocality": "Linnich",
            "postalCode": "52441",
            "addressCountry": "DE"
          }
        }
      }
    </script>
    <title>Tagesanker — Eine Sache. Realistisch. Zurückfinden.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
